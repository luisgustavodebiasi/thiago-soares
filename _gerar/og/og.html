<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Modelo da imagem de compartilhamento (1200x630). Gere com: zsh _gerar/og/gerar_og.sh -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,300&display=block">
<style>
  :root { --marinho: #0a2740; --marinho-950: #061a2c; --agua: #8ed2d8; --destaque: #5fd9cb; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Manrope", sans-serif; color: #fff;
    background: radial-gradient(120% 140% at 100% 0%, #16466e 0%, var(--marinho) 46%, var(--marinho-950) 100%);
  }
  .foto { position: absolute; left: 0; top: 0; width: 760px; height: 630px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 50%, rgba(0,0,0,0.55) 68%, transparent 92%);
    mask-image: linear-gradient(90deg, #000 0%, #000 50%, rgba(0,0,0,0.55) 68%, transparent 92%); }
  .foto img { position: absolute; left: -6px; top: -50px; height: 900px; }
  .foto::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(6, 26, 44, 0.6) 0%, rgba(6, 26, 44, 0) 32%),
      linear-gradient(180deg, rgba(6, 26, 44, 0.35) 0%, rgba(6, 26, 44, 0) 18%);
  }
  .moldura { position: absolute; inset: 22px; border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 6px; pointer-events: none; }
  .texto { position: absolute; left: 640px; top: 0; bottom: 0; width: 510px; display: flex; flex-direction: column; justify-content: center; }
  .rotulo { display: flex; align-items: center; gap: 14px; font-size: 17px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: var(--destaque); }
  .rotulo::before { content: ""; width: 34px; height: 1px; background: currentColor; }
  h1 { margin-top: 22px; font-family: "Newsreader", serif; font-weight: 400; font-size: 118px; line-height: 0.9; letter-spacing: -0.025em; font-variation-settings: "opsz" 72; }
  h1 em { font-style: italic; font-weight: 300; color: var(--agua); }
  .sub { margin-top: 26px; font-size: 24px; line-height: 1.45; font-weight: 500; color: rgba(255, 255, 255, 0.82); }
  .areas { display: flex; gap: 10px; margin-top: 30px; }
  .areas span { padding: 9px 18px; border: 1px solid rgba(255, 255, 255, 0.28); border-radius: 999px; font-size: 17px; font-weight: 600; letter-spacing: 0.02em; }
  .passagens { position: absolute; left: 640px; right: 50px; bottom: 50px; padding-top: 16px; border-top: 1px solid rgba(255, 255, 255, 0.16); font-family: "Newsreader", serif; font-size: 18px; color: rgba(255, 255, 255, 0.7); white-space: nowrap; }
  .passagens b { color: var(--destaque); font-weight: 400; margin: 0 6px; }
</style>
</head>
<body>
  <div class="foto"><img src="foto.jpg" alt=""></div>
  <div class="moldura"></div>
  <div class="texto">
    <span class="rotulo">Jornalista · Brasília</span>
    <h1>Thiago<br><em>Soares</em></h1>
    <p class="sub">Reportagem, apresentação e texto para TV, jornal, revista e rádio.</p>
    <div class="areas"><span>Vídeo</span><span>Impresso</span><span>Rádio</span></div>
  </div>
  <p class="passagens">Correio Braziliense<b>·</b>RecordTV<b>·</b>OAB Nacional<b>·</b>MPT<b>·</b>ANTT</p>
</body>
</html>
